name: CI

on:
  push:
    branches: [main, wip/**]  
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/*.py backend/app/routers/*.py backend/migrations/*.py backend/migrations/versions/*.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm install -g pnpm && pnpm install
      - run: cd frontend && pnpm build
