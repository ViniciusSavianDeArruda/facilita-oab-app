name: CI

on:
  push:
    branches: [main, wip/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENV: test
      # Valores fictícios: os testes não chamam o Gemini nem usam banco real.
      GEMINI_API_KEY: ci-dummy-key
      APP_PASSWORD: ci-dummy-password
      JWT_SECRET: ci-dummy-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/*.py backend/app/routers/*.py backend/migrations/*.py backend/migrations/versions/*.py
      - run: python -m unittest discover -s tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
