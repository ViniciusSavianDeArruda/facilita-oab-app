name: facilita-oab

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Sobrescreve o .env pra gravar o banco num volume nomeado, assim o
      # facilita.db sobrevive a rebuilds/restarts do container.
      DATABASE_URL: sqlite:////app/data/facilita.db
    volumes:
      - facilita_data:/app/data

volumes:
  facilita_data:
