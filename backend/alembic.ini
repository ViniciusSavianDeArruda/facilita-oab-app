# A generic, single database configuration.

[alembic]
# Path to migration scripts.
script_location = %(here)s/migrations

# Add the project root to sys.path.
prepend_sys_path = .

# Use the operating system's path separator.
path_separator = os

# The database URL is loaded from app/config.py (.env)
# by migrations/env.py, so it is intentionally left blank.
sqlalchemy.url =


[post_write_hooks]

# Format generated revisions with Black.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Lint generated revisions with Ruff.
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%
